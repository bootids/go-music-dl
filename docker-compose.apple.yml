# Apple Music 整曲下载（可选）。用法：
#   docker compose -f docker-compose.yml -f docker-compose.apple.yml up -d --build
# 需要自己的有效 Apple Music 订阅；账号写在 .env 里（见 .env.example）。
services:
  music-dl:
    # 上游镜像不含 wrapper 支持，必须用本仓库代码构建。
    # 另起本地镜像名并只从源码构建，避免 docker compose pull 用上游镜像顶掉。
    build: .
    image: go-music-dl-fork:local
    pull_policy: build
    environment:
      MUSIC_DL_APPLE_WRAPPER_URL: http://wrapper:12340
    depends_on: [wrapper]
  wrapper:
    # 只有 amd64 镜像；拉取失败（如镜像私有）时改用：
    #   build: https://github.com/WorldObservationLog/wrapper.git#lite
    image: ghcr.io/worldobservationlog/wrapper-lite:latest
    platform: linux/amd64
    privileged: true
    security_opt: ["seccomp:unconfined"]
    environment:
      USERNAME: ${APPLE_ID_USERNAME:-}
      PASSWORD: ${APPLE_ID_PASSWORD:-}
    # 不要放进 ./data：music-dl 启动时会把 ./data 整个 chown 给 appuser，
    # wrapper 在 user namespace 里只映射 root，之后就写不了自己的令牌文件。
    volumes: ["./wrapper-data:/app/rootfs/data"]
    expose: ["12340"] # 不要改成 ports：wrapper-lite 没有任何鉴权
    restart: unless-stopped
